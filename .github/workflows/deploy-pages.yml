name: Déployer Neuro Bob+ sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer Node.js pour les vérifications
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier la bibliothèque et le JavaScript
        run: npm run check

      - name: Préparer les fichiers publics
        run: |
          mkdir -p public
          cp index.html styles.css app.js editorial.js demo-scenarios.js intro.css intro.js public/
          cp -R assets public/
          cp -R design public/
          touch public/.nojekyll

      - name: Charger le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
